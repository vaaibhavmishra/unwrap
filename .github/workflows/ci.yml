name: Unwrap CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate for a release
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: unwrap-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-checks:
    name: Workflow and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: actionlint,shellcheck
      - name: Validate workflows
        run: actionlint
      - name: Check release scripts
        run: |
          shellcheck .github/scripts/setup-macos.sh script/release-macos
          python3 -m unittest discover -s script -p 'unwrap_release_tests.py' -v

  macos-checks:
    name: macOS tests and Clippy
    runs-on: macos-26
    timeout-minutes: 330
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: 'off'
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: 'off'
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-macos
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: unwrap-macos-checks
          cache-targets: false
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: nextest
      - name: Test release metadata on macOS
        run: python3 -m unittest discover -s script -p 'unwrap_release_tests.py' -v
      - name: Run app and shared terminal unit tests
        run: >-
          cargo nextest run --locked --lib -p warp -p warp_core -p warp_terminal
          --features warp/gui,warp/nld_classifier_v3,warp/nld_heuristic_v2
          --test-threads 2
      - name: Check app and shared terminal code
        run: >-
          cargo clippy --locked --lib --tests -p warp -p warp_core -p warp_terminal
          --features warp/gui,warp/nld_classifier_v3,warp/nld_heuristic_v2 -- -D warnings
      - name: Check Rust formatting
        run: ./script/format --check
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  ci-result:
    name: Unwrap CI passed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [workflow-checks, macos-checks]
    if: ${{ always() }}
    steps:
      - name: Require all checks to pass
        env:
          WORKFLOW_RESULT: ${{ needs.workflow-checks.result }}
          MACOS_RESULT: ${{ needs.macos-checks.result }}
        run: test "$WORKFLOW_RESULT" = success && test "$MACOS_RESULT" = success
