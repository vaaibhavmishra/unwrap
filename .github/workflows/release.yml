name: Release Unwrap (macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: unwrap-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and tag target
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 script/unwrap_release.py version "$RELEASE_TAG"
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$tag_commit" = "$(git rev-parse HEAD)"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

  checks:
    name: Release checks
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.commit }}

  build:
    name: Build macOS ${{ matrix.arch }}
    needs: [version, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_LTO_LTO: 'false'
      CARGO_PROFILE_RELEASE_LTO_DEBUG: 0
      CARGO_PROFILE_RELEASE_LTO_SPLIT_DEBUGINFO: 'off'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.version.outputs.commit }}
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-macos
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: unwrap-release-${{ matrix.arch }}
          cache-targets: false
      - name: Install packaging tools
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install create-dmg
          ./script/install_cargo_bundle
          ./script/install_cargo_release_deps --no-build-deps
      - name: Build and verify unsigned DMG
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: bash script/release-macos "$RELEASE_TAG" "$RELEASE_ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unwrap-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    name: Create draft GitHub Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unwrap-macos-*
          merge-multiple: true
          path: dist
      - name: Verify complete release and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          python3 script/unwrap_release.py assets "$RELEASE_TAG" dist
          python3 script/unwrap_release.py notes "$RELEASE_TAG" "$RELEASE_COMMIT" > release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > is-draft.txt; then
            if [ "$(cat is-draft.txt)" != true ]; then
              echo 'Refusing to replace an already published release. Use a new version tag.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.dmg dist/*.sha256 \
              --verify-tag --draft --title "Unwrap $RELEASE_TAG" \
              --generate-notes --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
