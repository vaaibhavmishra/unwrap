name: Set up Unwrap macOS builds
description: Install public build dependencies without Warp services or signing credentials
runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: '26'
    - name: Install native dependencies
      shell: bash
      run: bash .github/scripts/setup-macos.sh
